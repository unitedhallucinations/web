<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>United Hallucinations</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <svg class="grain" aria-hidden="true">
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
    </filter>
    <rect width="100%" height="100%" filter="url(#noise)"></rect>
  </svg>

  <div class="reg tl" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="9" fill="none" stroke="#0b0b0a" stroke-width="1"/><line x1="20" y1="0" x2="20" y2="40" stroke="#00e6f0" stroke-width="1"/><line x1="0" y1="20" x2="40" y2="20" stroke="#ff1bc4" stroke-width="1"/></svg></div>
  <div class="reg tr" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="9" fill="none" stroke="#0b0b0a" stroke-width="1"/><line x1="20" y1="0" x2="20" y2="40" stroke="#ff1bc4" stroke-width="1"/><line x1="0" y1="20" x2="40" y2="20" stroke="#00e6f0" stroke-width="1"/></svg></div>
  <div class="reg bl" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="9" fill="none" stroke="#0b0b0a" stroke-width="1"/><line x1="20" y1="0" x2="20" y2="40" stroke="#ff1bc4" stroke-width="1"/><line x1="0" y1="20" x2="40" y2="20" stroke="#00e6f0" stroke-width="1"/></svg></div>
  <div class="reg br" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="9" fill="none" stroke="#0b0b0a" stroke-width="1"/><line x1="20" y1="0" x2="20" y2="40" stroke="#00e6f0" stroke-width="1"/><line x1="0" y1="20" x2="40" y2="20" stroke="#ff1bc4" stroke-width="1"/></svg></div>

  <nav>
    <div class="mark">UNITED<span>·</span>HALLUCINATIONS</div>
    <button class="enter-btn" onclick="document.getElementById('gate').scrollIntoView({behavior:'smooth'})">Index</button>
  </nav>

  <main class="hero" id="gate">
    <div class="burst-wrap" id="burstWrap" aria-hidden="true"></div>

    <div class="content">
      <div class="eyebrow">state press — plate 01, off-register</div>
      <div class="title-wrap">
        <h1>
          <span class="ghost cyan" aria-hidden="true">United<br>Hallucinations</span>
          <span class="ghost magenta" aria-hidden="true">United<br>Hallucinations</span>
          United<br>Hallucinations
        </h1>
      </div>
      <div class="cta-row">
        <a class="cta" href="#gate">Enter</a>
      </div>
    </div>
  </main>

  <footer>
    <span>est. off-register</span>
    <span>scroll to misalign further</span>
  </footer>

<script src="script.js"></script>
</body>
</html>
